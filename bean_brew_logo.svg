<svg width="500" height="500" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Bean &amp; Brew Co. Logo</title>
  <desc>Clean modern circle badge logo, coffee bean and espresso machine icons in center</desc>

  <style>
    .bg-circle { fill: #F5ECD7; }
    .ring-outer { fill: none; stroke: #2B1400; stroke-width: 3; }
    .ring-mid   { fill: none; stroke: #2B1400; stroke-width: 1; }
    .ring-inner-fill { fill: #2B1400; }
    .ring-inner-stroke { fill: none; stroke: #C07820; stroke-width: 1.5; }
    .brand-text { fill: #F5ECD7; font-family: Georgia, 'Times New Roman', serif; }
    .gold-text  { fill: #C07820; font-family: Georgia, 'Times New Roman', serif; }
    .divider    { stroke: #C07820; stroke-width: 0.8; fill: none; }
    .dot        { fill: #C07820; }
    .bean-body  { fill: #C07820; }
    .steam      { fill: none; stroke: #C07820; stroke-width: 1.4; stroke-linecap: round; opacity: 0.7; }
  </style>

  <circle cx="340" cy="260" r="212" class="bg-circle"/>
  <circle cx="340" cy="260" r="210" class="ring-outer"/>
  <circle cx="340" cy="260" r="190" class="ring-mid"/>
  <circle cx="340" cy="260" r="170" class="ring-inner-fill"/>
  <circle cx="340" cy="260" r="170" class="ring-inner-stroke"/>

  <polygon points="340,72  344,82  340,92  336,82" class="dot"/>
  <polygon points="340,428 344,418 340,408 336,418" class="dot"/>

  <g transform="translate(288,248)">
    <ellipse cx="0" cy="0" rx="30" ry="42" class="bean-body"/>
    <path d="M0,-40 C5,-20 5,20 0,40 C-5,20 -5,-20 0,-40" fill="#7B4010"/>
    <ellipse cx="-10" cy="-14" rx="7" ry="11" fill="#E8A440" opacity="0.25" transform="rotate(-20)"/>
  </g>

  <line x1="340" y1="215" x2="340" y2="295" class="divider" stroke-dasharray="4,3"/>

  <g transform="translate(392,248)">
    <rect x="-28" y="-40" width="56" height="52" rx="6" fill="#3A1A06" stroke="#C07820" stroke-width="1.5"/>
    <rect x="-28" y="-40" width="56" height="13" rx="6" fill="#C07820"/>
    <rect x="-28" y="-33" width="56" height="7" fill="#C07820"/>
    <rect x="-16" y="-24" width="22" height="14" rx="2" fill="#1C0D04" stroke="#C07820" stroke-width="0.8"/>
    <circle cx="14" cy="-17" r="5" fill="#C07820"/>
    <circle cx="14" cy="-17" r="2.5" fill="#F5ECD7"/>
    <rect x="-10" y="12" width="20" height="5" rx="2.5" fill="#C07820"/>
    <rect x="-8" y="17" width="5" height="7" rx="1" fill="#C07820"/>
    <rect x="3" y="17" width="5" height="7" rx="1" fill="#C07820"/>
    <path d="M-13,28 L13,28 L9,42 L-9,42 Z" fill="none" stroke="#C07820" stroke-width="1.5"/>
    <line x1="-13" y1="28" x2="13" y2="28" stroke="#C07820" stroke-width="1.5"/>
    <path d="M-4,24 C-4,18 0,15 0,10" class="steam"/>
    <path d="M4,24 C4,18 8,15 8,10" class="steam"/>
  </g>

  <line x1="230" y1="322" x2="450" y2="322" class="divider"/>
  <text x="340" y="350" text-anchor="middle" class="brand-text" font-size="22" font-weight="700" letter-spacing="6">BEAN &amp; BREW</text>
  <text x="340" y="372" text-anchor="middle" class="gold-text" font-size="11" letter-spacing="6">COMPANY</text>
  <line x1="270" y1="382" x2="410" y2="382" class="divider"/>
</svg>
