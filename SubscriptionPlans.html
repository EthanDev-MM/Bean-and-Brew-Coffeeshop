<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Subscription Plans | Bean & Brew</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="SubscriptionPlans.css">
</head>

<body>

<h2 class="title">Choose Your Coffee Plan ☕</h2>

<div class="container">
  <div class="row">

    <!-- BASIC -->
    <div class="col-md-4 mb-4">
      <div class="plan-card">
        <h4>Basic</h4>
        <h2>$9<span>/month</span></h2>
        <ul>
          <li>✔ 5 Coffee / Month</li>
          <li>✔ Basic Support</li>
          <li>✖ Free Delivery</li>
        </ul>
        <button>Choose Plan</button>
      </div>
    </div>

    <!-- PREMIUM -->
    <div class="col-md-4 mb-4">
      <div class="plan-card active">
        <h4>Premium</h4>
        <h2>$19<span>/month</span></h2>
        <ul>
          <li>✔ 15 Coffee / Month</li>
          <li>✔ Priority Support</li>
          <li>✔ Free Delivery</li>
        </ul>
        <button>Best Choice</button>
      </div>
    </div>

    <!-- VIP -->
    <div class="col-md-4 mb-4">
      <div class="plan-card">
        <h4>VIP</h4>
        <h2>$29<span>/month</span></h2>
        <ul>
          <li>✔ Unlimited Coffee</li>
          <li>✔ 24/7 Support</li>
          <li>✔ Free Delivery + Gifts</li>
        </ul>
        <button>Go VIP</button>
      </div>
    </div>

  </div>
</div>

</body>
</html>
